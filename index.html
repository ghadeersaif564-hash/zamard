<!DOCTYPE html>
<html lang="ar" dir="rtl"> 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كتالوج المتجر</title>
    <style>
        :root {
            /* درجات اللون الأخضر الزمردي */
            --emerald-dark: #064e3b;
            --emerald-main: #047857;
            --emerald-light: #10b981;
            --emerald-soft: #ecfdf5;
            --bg-color: #f8fafc;
            --text-dark: #1e293b;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            line-height: 1.6;
        }
        /* الهيدر والشعار ومعلومات التواصل */
        header {
            background: linear-gradient(135deg, var(--emerald-dark), var(--emerald-main));
            color: white;
            text-align: center;
            padding: 2rem 1rem;
            box-shadow: 0 4px 12px rgba(4, 120, 87, 0.2);
        }
        .logo {
            width: 110px;
            height: 110px;
            object-fit: cover;
            border-radius: 50%;
            border: 3px solid var(--emerald-light);
            background-color: white;
            margin-bottom: 1rem;
        }
        header h1 {
            font-size: 2rem;
            margin-bottom: 0.3rem;
        }
        .contact-bar {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 1rem;
            margin-top: 1rem;
        }
        .contact-link {
            background-color: rgba(255, 255, 255, 0.15);
            color: white;
            text-decoration: none;
            padding: 0.4rem 1rem;
            border-radius: 20px;
            font-size: 0.9rem;
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: background 0.2s;
        }
        .contact-link:hover {
            background-color: var(--emerald-light);
        }

        /* شريط البحث والتصنيفات */
        .controls {
            max-width: 1200px;
            margin: 1.5rem auto;
            padding: 0 1rem;
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: space-between;
            align-items: center;
        }
        .search-box {
            flex: 1;
            min-width: 250px;
            padding: 0.75rem 1rem;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
        }
        .search-box:focus {
            border-color: var(--emerald-main);
        }
        .category-filter {
            padding: 0.75rem 1rem;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            font-size: 1rem;
            background: white;
            cursor: pointer;
        }

        /* شبكة المنتجات */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1rem 3rem 1rem;
        }
        .catalog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 1.5rem;
        }
        .product-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            border: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .media-wrapper {
            width: 100%;
            height: 230px;
            background-color: var(--emerald-soft);
            position: relative;
        }
        .media-wrapper img, .media-wrapper iframe {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border: none;
        }
        .category-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: var(--emerald-dark);
            color: white;
            padding: 0.2rem 0.6rem;
            border-radius: 6px;
            font-size: 0.75rem;
        }
        .product-info {
            padding: 1.2rem;
            text-align: center;
        }
        .product-title {
            font-size: 1.15rem;
            font-weight: bold;
            margin-bottom: 0.4rem;
            color: var(--emerald-dark);
        }
        .product-desc {
            font-size: 0.85rem;
            color: #64748b;
            margin-bottom: 0.8rem;
        }
        .product-price {
            font-size: 1.25rem;
            font-weight: bold;
            color: var(--emerald-main);
            margin-bottom: 1rem;
        }
        .order-btn {
            display: block;
            width: 100%;
            padding: 0.7rem;
            background-color: var(--emerald-main);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: background 0.2s;
        }
        .order-btn:hover {
            background-color: var(--emerald-dark);
        }

        /* أزرار التنقل بين الصفحات (مهم لـ 2000 منتج) */
        .pagination {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 2.5rem;
            flex-wrap: wrap;
        }
        .page-btn {
            padding: 0.6rem 1.2rem;
            border: 1px solid var(--emerald-main);
            background: white;
            color: var(--emerald-main);
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .page-btn.active, .page-btn:hover {
            background: var(--emerald-main);
            color: white;
        }
    </style>
</head>
<body>

    <header>
        <!-- ضع رابط أو اسم ملف الشعار هنا -->
        <img src="WhatsApp Image 2026-11-12 at 10.18.36 PM.jpeg" alt="شعار المتجر" class="logo">
        <h1>متجر زمردة</h1>
        <p>أجود المنتجات بأفضل الأسعار</p>
        
        <!-- روابط التواصل والحسابات -->
        <div class="contact-bar">
            <a href="tel:+96892613854" class="contact-link">📞 اتصل بنا: </a>
            <a href="https://wa.me/96892613854" target="_blank" class="contact-link">💬 واتساب</a>
            <a href="https://www.instagram.com/2h_zmard?dlrf=MWptaGR4OGFreDl0Mw%3D%3D&utm_source=qr" target="_blank" class="contact-link">📸 إنستغرام: @your_account</a>
        </div>
    </header>

    <!-- البحث والتصفية -->
    <div class="controls">
        <input type="text" id="searchInput" class="search-box" placeholder="ابحث عن اسم المنتج...">
        <select id="categoryFilter" class="category-filter">
            <option value="all">جميع الأقسام</option>
        </select>
    </div>

    <div class="container">
        <div class="catalog-grid" id="catalog"></div>
        <div class="pagination" id="pagination"></div>
    </div>

    <script>
        // ==========================================
        // الإعدادات الأساسية
        const whatsappNumber = "96892613854"; // رقم الواتساب بدون +
        const itemsPerPage = 24; // عدد المنتجات في كل صفحة (لحماية المتصفح من البطء)

        // قائمة المنتجات (يمكنك إضافة حتى 2000 منتج هنا)
        // ملاحظة للفيديو: استخدم رابط التضمين Embed من يوتيوب
      const products = [
            {
                name: "طقم زمرد فاخر",
                category: "مجوهرات",
                description: "تصميم أنيق وعصري مناسب للمناسبات.",
                price: "35.000 ر.ع",
                type: "image", // نوع العرض: image أو video
                media: "https://via.placeholder.com/400x300/ecfdf5/047857?text=Product+1"
            },
            {
                name: "فيديو استعراض المنتج",
                category: "عروض خاصة",
                description: "شاهد تفاصيل المنتج وجودته على الطبيعة.",
                price: "45.000 ر.ع",
                type: "video", 
                media: "https://www.youtube.com/embed/dQw4w9WgXcQ" // رابط YouTube Embed
            },
            {
                name: "عطر العود الملكي",
                category: "عطور",
                description: "ثبات يدوم طويلاً برائحة فواحة.",
                price: "18.500 ر.ع",
                type: "image",
                media: "https://via.placeholder.com/400x300/ecfdf5/047857?text=Product+3"
              },
         {
                name: `ساعة فاخرة رقم $}`,
                category: "ساعات",
                description: "ساعة أنيقة عالية الجودة بتصميم مميز.",
                price: "25.000 ر.ع",
                type: "image",
                media: `watch$.jpg`
              }
        ];
        // ==========================================

        let currentPage = 1;
        let filteredProducts = [...products];

        const catalogEl = document.getElementById('catalog');
        const paginationEl = document.getElementById('pagination');
        const searchInput = document.getElementById('searchInput');
        const categoryFilter = document.getElementById('categoryFilter');

        // تعبئة قائمة الأقسام تلقائياً
        const categories = [...new Set(products.map(p => p.category))];
        categories.forEach(cat => {
            const option = document.createElement('option');
            option.value = cat;
            option.textContent = cat;
            categoryFilter.appendChild(option);
        });

        function renderCatalog() {
            catalogEl.innerHTML = '';
            const start = (currentPage - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const pageItems = filteredProducts.slice(start, end);

            pageItems.forEach(product => {
                const message = encodeURIComponent(`مرحباً، أرغب في طلب: ${product.name} - السعر: ${product.price}`);
                const whatsappLink = `https://wa.me/${whatsappNumber}?text=${message}`;

                // تحديد هل الوسائط صورة أم فيديو
                const mediaHtml = product.type === 'video' 
                    ? `<iframe src="${product.media}" loading="lazy" allowfullscreen></iframe>`
                    : `<img src="${product.media}" alt="${product.name}" loading="lazy">`;

                const card = `
                    <div class="product-card">
                        <div class="media-wrapper">
                            <span class="category-badge">${product.category}</span>
                            ${mediaHtml}
                        </div>
                        <div class="product-info">
                            <div class="product-title">${product.name}</div>
                            <div class="product-desc">${product.description}</div>
                            <div class="product-price">${product.price}</div>
                            <a href="${whatsappLink}" target="_blank" class="order-btn">اطلب عبر واتساب</a>
                        </div>
                    </div>
                `;
                catalogEl.innerHTML += card;
            });

            renderPagination();
        }

        function renderPagination() {
            paginationEl.innerHTML = '';
            const totalPages = Math.ceil(filteredProducts.length / itemsPerPage);
            if (totalPages <= 1) return;

            for (let i = 1; i <= totalPages; i++) {
                const btn = document.createElement('button');
                btn.textContent = i;
                btn.className = `page-btn ${i === currentPage ? 'active' : ''}`;
                btn.onclick = () => {
                    currentPage = i;
                    renderCatalog();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                };
                paginationEl.appendChild(btn);
            }
        }

        function filterData() {
            const query = searchInput.value.toLowerCase();
            const selectedCat = categoryFilter.value;

            filteredProducts = products.filter(p => {
                const matchesName = p.name.toLowerCase().includes(query) || p.description.toLowerCase().includes(query);
                const matchesCat = selectedCat === 'all' || p.category === selectedCat;
                return matchesName && matchesCat;
            });

            currentPage = 1;
            renderCatalog();
        }

        searchInput.addEventListener('input', filterData);
        categoryFilter.addEventListener('change', filterData);

        // تشغيل العرض لأول مرة
        renderCatalog();
    </script>

</body>
</html>
