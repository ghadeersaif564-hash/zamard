
      <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كتالوج المتجر</title>
    <style>
        :root {
            /* درجات اللون الأخضر الزمردي */
            --emerald-dark: #064e3b;
            --emerald-main: #047857;
            --emerald-light: #10b981;
            --emerald-soft: #ecfdf5;
            --bg-color: #f8fafc;
            --text-dark: #1e293b;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            line-height: 1.6;
        }
        /* الهيدر والشعار ومعلومات التواصل */
        header {
            background: linear-gradient(135deg, var(--emerald-dark), var(--emerald-main));
            color: white;
            text-align: center;
            padding: 2rem 1rem;
            box-shadow: 0 4px 12px rgba(4, 120, 87, 0.2);
        }
        .logo {
            width: 110px;
            height: 110px;
            object-fit: cover;
            border-radius: 50%;
            border: 3px solid var(--emerald-light);
            background-color: white;
            margin-bottom: 1rem;
        }
        header h1 {
            font-size: 2rem;
            margin-bottom: 0.3rem;
        }
        .contact-bar {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 1rem;
            margin-top: 1rem;
        }
        .contact-link {
            background-color: rgba(255, 255, 255, 0.15);
            color: white;
            text-decoration: none;
            padding: 0.4rem 1rem;
            border-radius: 20px;
            font-size: 0.9rem;
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: background 0.2s;
        }
        .contact-link:hover {
            background-color: var(--emerald-light);
        }
        .working-hours {
            margin-top: 1rem;
            font-size: 0.9rem;
            background-color: rgba(255, 255, 255, 0.1);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            display: inline-block;
        }

        /* شريط البحث والتصنيفات */
        .controls {
            max-width: 1200px;
            margin: 1.5rem auto;
            padding: 0 1rem;
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: space-between;
            align-items: center;
        }
        .search-box {
            flex: 1;
            min-width: 250px;
            padding: 0.75rem 1rem;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
        }
        .search-box:focus {
            border-color: var(--emerald-main);
        }
        .category-filter {
            padding: 0.75rem 1rem;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            font-size: 1rem;
            background: white;
            cursor: pointer;
        }

        /* شبكة المنتجات */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1rem 3rem 1rem;
        }
        .catalog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 1.5rem;
        }
        .product-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            border: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .media-wrapper {
            width: 100%;
            height: 230px;
            background-color: var(--emerald-soft);
            position: relative;
        }
        .media-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .category-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: var(--emerald-dark);
            color: white;
            padding: 0.2rem 0.6rem;
            border-radius: 6px;
            font-size: 0.75rem;
        }
        .product-info {
            padding: 1.2rem;
            text-align: center;
        }
        .product-title {
            font-size: 1.15rem;
            font-weight: bold;
            margin-bottom: 0.4rem;
            color: var(--emerald-dark);
        }
        .product-desc {
            font-size: 0.85rem;
            color: #64748b;
            margin-bottom: 0.8rem;
        }
        .product-price {
            font-size: 1.25rem;
            font-weight: bold;
            color: var(--emerald-main);
            margin-bottom: 1rem;
        }
        .order-btn {
            display: block;
            width: 100%;
            padding: 0.7rem;
            background-color: var(--emerald-main);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: background 0.2s;
        }
        .order-btn:hover {
            background-color: var(--emerald-dark);
        }

        /* أزرار التنقل بين الصفحات */
        .pagination {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 2.5rem;
            flex-wrap: wrap;
        }
        .page-btn {
            padding: 0.6rem 1.2rem;
            border: 1px solid var(--emerald-main);
            background: white;
            color: var(--emerald-main);
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .page-btn.active, .page-btn:hover {
            background: var(--emerald-main);
            color: white;
        }
    </style>
</head>
<body>

        <h1>اسم مشروعك التجاري</h1>

        <div class="contact-bar">
            <a href="tel:+96890000000" class="contact-link">📞 اتصل بنا: 90000000</a>
            <a href="https://wa.me/96890000000" target="_blank" class="contact-link">💬 واتساب</a>
            <a href="https://instagram.com/your_account" target="_blank" class="contact-link">📸 إنستغرام: @your_account</a>
        </div>

        <div class="working-hours">
            🕒 <b>ساعات العمل:</b> من السبت إلى الخميس (9 صباحاً - 10 مسائاً)
        </div>
    </header>
