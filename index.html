<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كتالوج المتجر</title>
    <style>
        :root {
            --emerald-dark: #064e3b;
            --emerald-main: #047857;
            --emerald-light: #10b981;
            --emerald-soft: #ecfdf5;
            --bg-color: #f8fafc;
            --text-dark: #1e293b;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            line-height: 1.6;
        }
        header {
            background: linear-gradient(135deg, var(--emerald-dark), var(--emerald-main));
            color: white;
            text-align: center;
            padding: 2rem 1rem;
            box-shadow: 0 4px 12px rgba(4, 120, 87, 0.2);
        }
        .logo {
            width: 110px;
            height: 110px;
            object-fit: cover;
            border-radius: 50%;
            border: 3px solid var(--emerald-light);
            background-color: white;
            margin-bottom: 1rem;
        }
        header h1 {
            font-size: 2rem;
            margin-bottom: 0.3rem;
        }
        .contact-bar {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 1rem;
            margin-top: 1rem;
        }
        .contact-link {
            background-color: rgba(255, 255, 255, 0.15);
            color: white;
            text-decoration: none;
            padding: 0.4rem 1rem;
            border-radius: 20px;
            font-size: 0.9rem;
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: background 0.2s;
        }
        .contact-link:hover {
            background-color: var(--emerald-light);
        }
        .working-hours {
            margin-top: 1rem;
            font-size: 0.9rem;
            background-color: rgba(255, 255, 255, 0.1);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            display: inline-block;
        }

        /* أزرار الأقسام البارزة وشريط البحث */
        .controls-wrapper {
            max-width: 1200px;
            margin: 1.5rem auto;
            padding: 0 1rem;
        }
        .category-buttons {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 0.7rem;
            margin-bottom: 1.2rem;
        }
        .cat-btn {
            padding: 0.6rem 1.4rem;
            border: 2px solid var(--emerald-main);
            background-color: white;
            color: var(--emerald-dark);
            border-radius: 25px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        .cat-btn.active, .cat-btn:hover {
            background-color: var(--emerald-main);
            color: white;
        }
        .search-box {
            display: block;
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            padding: 0.75rem 1rem;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
        }
        .search-box:focus {
            border-color: var(--emerald-main);
        }

        /* شبكة المنتجات */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1rem 3rem 1rem;
        }
        .catalog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 1.5rem;
        }
        .product-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            border: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .media-wrapper {
            width: 100%;
            height: 230px;
            background-color: var(--emerald-soft);
            position: relative;
        }
        .media-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .category-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: var(--emerald-dark);
            color: white;
            padding: 0.2rem 0.6rem;
            border-radius: 6px;
            font-size: 0.75rem;
        }
        .product-info {
            padding: 1.2rem;
            text-align: center;
        }
        .product-title {
            font-size: 1.15rem;
            font-weight: bold;
            margin-bottom: 0.4rem;
            color: var(--emerald-dark);
        }
        .product-desc {
            font-size: 0.85rem;
            color: #64748b;
            margin-bottom: 0.8rem;
        }
        .product-price {
            font-size: 1.25rem;
            font-weight: bold;
            color: var(--emerald-main);
            margin-bottom: 1rem;
        }
        .order-btn {
            display: block;
            width: 100%;
            padding: 0.7rem;
            background-color: var(--emerald-main);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: background 0.2s;
        }
        .order-btn:hover {
            background-color: var(--emerald-dark);
        }
        .pagination {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 2.5rem;
            flex-wrap: wrap;
        }
        .page-btn {
            padding: 0.6rem 1.2rem;
            border: 1px solid var(--emerald-main);
            background: white;
            color: var(--emerald-main);
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .page-btn.active, .page-btn:hover {
            background: var(--emerald-main);
            color: white;
        }
    </style>
</head>
<body>

    <header>
        <img src="logo.png" alt="شعار المتجر" class="logo">
        <h1>اسم مشروعك التجاري</h1>
        <p>أجود المنتجات بأفضل الأسعار</p>
        
        <div class="contact-bar">
            <a href="tel:+96890000000" class="contact-link">📞 اتصل بنا: 90000000</a>
            <a href="https://wa.me/96890000000" target="_blank" class="contact-link">💬 واتساب</a>
            <a href="https://instagram.com/your_account" target="_blank" class="contact-link">📸 إنستغرام: @your_account</a>
        </div>

        <div class="working-hours">
            🕒 <b>ساعات العمل:</b> من السبت إلى الخميس (9 صباحاً - 10 مسائاً)
        </div>
    </header>

    <div class="controls-wrapper">
        <div class="category-buttons" id="categoryButtons">
            <button class="cat-btn active" data-cat="all">جميع الأقسام</button>
        </div>
        <input type="text" id="searchInput" class="search-box" placeholder="ابحث عن اسم المنتج...">
    </div>

    <div class="container">
        <div class="catalog-grid" id="catalog"></div>
        <div class="pagination" id="pagination"></div>
    </div>

    <script>
        const whatsappNumber = "96890000000";
        const itemsPerPage = 24;

        const products = [
            // 1. قسم الجلاتين: من A إلى Z
            ...Array.from({ length: 26 }, (_, index) => {
                const letter = String.fromCharCode(65 + index);
                return {
                    name: `منتج جلاتين حرف ${letter}`,
                    category: "جلاتين",
                    description: "جلاتين عالي الجودة ومتعدد الاستخدامات.",
                    price: "15.000 ر.ع",
                    media: `${letter}.jpg`
                };
            }),

            // 2. قسم الهدايا: من 100 إلى 200
            ...Array.from({ length: 101 }, (_, index) => {
                const imgNum = 100 + index;
                return {
                    name: `طقم هدايا مميز رقم ${imgNum}`,
                    category: "هدايا",
                    description: "هدايا فاخرة تناسب جميع المناسبات السعيدة.",
                    price: "30.000 ر.ع",
                    media: `${imgNum}.jpg`
                };
            }),

            // 3. قسم المكياج والعناية: من 300 إلى 400
            ...Array.from({ length: 101 }, (_, index) => {
                const imgNum = 300 + index;
                return {
                    name: `منتج مكياج وعناية رقم ${imgNum}`,
                    category: "مكياج وعناية",
                    description: "أفضل منتجات التجميل والعناية الشخصية الأصلية.",
                    price: "12.000 ر.ع",
                    media: `${imgNum}.jpg`
                };
            }),

            // 4. قسم الساعات: من 1 إلى 69
            ...Array.from({ length: 69 }, (_, index) => ({
                name: `ساعة فاخرة رقم ${index + 1}`,
                category: "ساعات",
                description: "ساعة أنيقة وعالية الجودة بتصميم مميز.",
                price: "25.000 ر.ع",
                media: `${index + 1}.jpg`
            }))
        ];

        let currentPage = 1;
        let selectedCategory = 'all';
        let filteredProducts = [...products];

        const catalogEl = document.getElementById('catalog');
        const paginationEl = document.getElementById('pagination');
        const searchInput = document.getElementById('searchInput');
        const categoryButtonsEl = document.getElementById('categoryButtons');

        // إنشاء أزرار الأقسام تلقائياً
        const categories = [...new Set(products.map(p => p.category))];
        categories.forEach(cat => {
            const btn = document.createElement('button');
            btn.className = 'cat-btn';
            btn.textContent = cat;
            btn.dataset.cat = cat;
            categoryButtonsEl.appendChild(btn);
        });

        // تفعيل الضغط على أزرار الأقسام
        categoryButtonsEl.addEventListener('click', (e) => {
            if (!e.target.classList.contains('cat-btn')) return;
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
            selectedCategory = e.target.dataset.cat;
            filterData();
        });

        function renderCatalog() {
            catalogEl.innerHTML = '';
            const start = (currentPage - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const pageItems = filteredProducts.slice(start, end);

            pageItems.forEach(product => {
                const message = encodeURIComponent(`مرحباً، أرغب في طلب: ${product.name} - السعر: ${product.price}`);
                const whatsappLink = `https://wa.me/${whatsappNumber}?text=${message}`;

                const card = `
                    <div class="product-card">
                        <div class="media-wrapper">
                            <span class="category-badge">${product.category}</span>
                            <img src="${product.media}" alt="${product.name}" loading="lazy">
                        </div>
                        <div class="product-info">
                            <div class="product-title">${product.name}</div>
                            <div class="product-desc">${product.description}</div>
                            <div class="product-price">${product.price}</div>
                            <a href="${whatsappLink}" target="_blank" class="order-btn">اطلب عبر واتساب</a>
                        </div>
                    </div>
                `;
                catalogEl.innerHTML += card;
            });

            renderPagination();
        }

        function renderPagination() {
            paginationEl.innerHTML = '';
            const totalPages = Math.ceil(filteredProducts.length / itemsPerPage);
            if (totalPages <= 1) return;

            for (let i = 1; i <= totalPages; i++) {
                const btn = document.createElement('button');
                btn.textContent = i;
                btn.className = `page-btn ${i === currentPage ? 'active' : ''}`;
                btn.onclick = () => {
                    currentPage = i;
                    renderCatalog();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                };
                paginationEl.appendChild(btn);
            }
        }

        function filterData() {
            const query = searchInput.value.toLowerCase();
            filteredProducts = products.filter(p => {
                const matchesName = p.name.toLowerCase().includes(query) || p.description.toLowerCase().includes(query);
                const matchesCat = selectedCategory === 'all' || p.category === selectedCategory;
                return matchesName && matchesCat;
            });
            currentPage = 1;
            renderCatalog();
        }

        searchInput.addEventListener('input', filterData);
        renderCatalog();
    </script>

</body>
</html>
